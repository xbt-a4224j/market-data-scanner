services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scanner-postgres
    environment:
      POSTGRES_DB: scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
    ports:
      - "5433:5432"   # 5432 on host is reserved for other local projects; this repo lives on 5433
    volumes:
      - scanner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  scanner_pgdata:
