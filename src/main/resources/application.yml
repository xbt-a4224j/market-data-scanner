spring:
  application:
    name: market-data-scanner

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/scanner}
    username: ${DATABASE_USERNAME:scanner}
    password: ${DATABASE_PASSWORD:scanner}

  jpa:
    hibernate:
      ddl-auto: validate           # Flyway owns the schema; Hibernate just validates
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-opus-4-7              # per-pool evidence summaries
          max-tokens: 800
          temperature: 0.2
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small        # 1536-dim, $0.02/1M tokens
      chat:
        # We don't use OpenAI for chat (Anthropic owns that) - this section
        # is here only because spring-ai-starter-model-openai auto-configures
        # both clients and bails if chat options are missing on some versions.
        options:
          model: gpt-4o-mini

  # Cache topology lives in CacheConfig.kt - per-cache TTLs (30m default for
  # slow-changing labels / prices) instead of one blanket spec.
  cache:
    type: caffeine

  thymeleaf:
    cache: false                   # disable in dev; enable in fly.toml for prod

ethereum:
  rpc:
    # Either set the full URL via ETHEREUM_RPC_URL / ETHEREUM_WS_URL, or set
    # INFURA_API_KEY (or ALCHEMY_API_KEY) and let the URL be constructed.
    http-url: ${ETHEREUM_RPC_URL:https://mainnet.infura.io/v3/${INFURA_API_KEY:demo}}
    websocket-url: ${ETHEREUM_WS_URL:wss://mainnet.infura.io/ws/v3/${INFURA_API_KEY:demo}}
  factory:
    uniswap-v3-address: "0x1F98431c8aD98523631AE4a59f267346ea31F984"
  startup:
    mode: ${INGESTION_MODE:live}   # 'live' or 'backfill'
    backfill-lookback-days: ${BACKFILL_LOOKBACK_DAYS:0}

etherscan:
  api-key: ${ETHERSCAN_API_KEY:}
  base-url: "https://api.etherscan.io/v2/api"

heuristics:
  weights:
    supply_concentration: 0.20
    lp_lock: 0.20
    deployer_history: 0.30
    metadata_similarity: 0.15
    funding_flow: 0.0          # stubbed, weight 0 until implemented
    source_code_pattern: 0.0
    first_n_buyers: 0.0
    social_media_correlation: 0.0

  thresholds:
    high_risk: 70              # composite score above this flags for admin review
    high_confidence: 0.85      # heuristic confidence floor for "decisive" alerts

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      access: read_only
  metrics:
    distribution:
      percentiles-histogram:
        heuristic.latency: true
      percentiles:
        heuristic.latency: 0.5, 0.95, 0.99

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin}

server:
  port: ${PORT:8080}
  shutdown: graceful

logging:
  pattern:
    console: '{"ts":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","logger":"%logger","thread":"%thread","msg":"%message","mdc":"%mdc"}%n'
  level:
    root: INFO
    io.github.xbta4224j.scanner: DEBUG
    org.web3j.protocol: INFO
    org.springframework.web: INFO
