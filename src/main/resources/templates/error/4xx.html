<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Not found')}"></head>
<body>
<div th:replace="~{fragments/header :: topbar('overview')}"></div>
<main>
    <div class="error-card">
        <div class="error-status">
            <span class="error-code" th:text="${status} ?: 404">404</span>
            <span class="error-label" th:text="${error} ?: 'Not Found'">Not Found</span>
        </div>
        <h1 class="page-title" style="margin-top: 0;">
            We could not find what you were looking for
        </h1>
        <p class="page-subtitle" style="max-width: 560px;">
            The page or resource at
            <code class="mono" th:text="${path} ?: '(unknown)'">/</code>
            does not exist. If you got here from an internal link, that is a
            bug worth filing - the dashboard should not be advertising routes
            it cannot serve.
        </p>
        <p class="page-subtitle" th:if="${message != null and message != ''}"
           style="color: var(--text-3);"
           th:text="${message}">message</p>
        <div class="error-actions">
            <a class="error-btn primary" th:href="@{/}">Back to overview</a>
            <a class="error-btn" th:href="@{/admin/queue}">Open queue</a>
            <a class="error-btn" th:href="@{/admin/events}">Live events</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments/header :: foot}"></div>
</body>
</html>
