<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<tr th:fragment="row(pool)"
    th:class="${rowClass != null} ? ${rowClass} : ''">
    <td class="mono muted">
        <time th:attr="data-iso=${pool.detectedAt}"
              th:text="${pool.detectedAtTime}"
              th:title="${pool.detectedAt}">--:--:--</time>
    </td>
    <td class="numeric" th:text="${pool.blockNumber}">0</td>
    <td class="addr">
        <span class="addr-cell">
            <a th:href="@{|/pool/${pool.id}|}"
               th:title="${pool.tokenAddress}"
               th:text="${pool.shortTokenAddress}">0x0..0</a>
            <button type="button" class="copy-btn"
                    th:attr="data-copy=${pool.tokenAddress}"
                    title="Copy token address" aria-label="Copy">
                <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">
                    <rect x="4.5" y="4.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor"/>
                    <path d="M2.5 11V3.5A1 1 0 0 1 3.5 2.5H11" fill="none" stroke="currentColor"/>
                </svg>
            </button>
        </span>
    </td>
    <td class="addr muted">
        <span class="addr-cell" th:if="${pool.deployerAddress != ''}">
            <a th:href="|https://etherscan.io/address/${pool.deployerAddress}|"
               target="_blank" rel="noreferrer"
               th:title="${pool.deployerAddress}"
               th:text="${pool.shortDeployerAddress}">0x0..0</a>
            <button type="button" class="copy-btn"
                    th:attr="data-copy=${pool.deployerAddress}"
                    title="Copy deployer address" aria-label="Copy">
                <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true">
                    <rect x="4.5" y="4.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor"/>
                    <path d="M2.5 11V3.5A1 1 0 0 1 3.5 2.5H11" fill="none" stroke="currentColor"/>
                </svg>
            </button>
        </span>
        <span th:unless="${pool.deployerAddress != ''}" class="muted">&mdash;</span>
    </td>
    <td class="addr muted">
        <a th:href="|https://etherscan.io/token/${pool.pairedWithAddress}|"
           target="_blank" rel="noreferrer"
           th:title="${pool.pairedWithAddress}"
           th:text="${pool.shortPairedWithAddress}">0x0..0</a>
    </td>
    <td class="numeric" th:text="${pool.feeTier / 10000.0} + '%'">0.30%</td>
    <td>
        <span class="risk-badge"
              th:classappend="'risk-' + ${pool.riskBand}"
              th:text="${pool.compositeScore}">0</span>
    </td>
    <td>
        <th:block th:each="sig : ${pool.flaggedSignals}">
            <span class="signal-tag" th:text="${sig}">signal</span>
        </th:block>
        <span class="muted" th:if="${pool.flaggedSignals.isEmpty()}">&mdash;</span>
    </td>
</tr>
</body>
</html>
