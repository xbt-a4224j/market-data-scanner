<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<tr th:fragment="row(pool)"
    th:class="${rowClass != null} ? ${rowClass} : ''">
    <td class="mono muted" th:text="${pool.detectedAtTime}">--:--:--</td>
    <td class="numeric" th:text="${pool.blockNumber}">0</td>
    <td class="addr">
        <a th:href="@{|/pool/${pool.id}|}"
           th:title="${pool.tokenAddress}"
           th:text="${pool.shortTokenAddress}">0x0..0</a>
    </td>
    <td class="addr muted">
        <a th:if="${pool.deployerAddress != ''}"
           th:href="|https://etherscan.io/address/${pool.deployerAddress}|"
           target="_blank" rel="noreferrer"
           th:title="${pool.deployerAddress}"
           th:text="${pool.shortDeployerAddress}">0x0..0</a>
        <span th:unless="${pool.deployerAddress != ''}" class="muted">&mdash;</span>
    </td>
    <td class="addr muted">
        <a th:href="|https://etherscan.io/token/${pool.pairedWithAddress}|"
           target="_blank" rel="noreferrer"
           th:title="${pool.pairedWithAddress}"
           th:text="${pool.shortPairedWithAddress}">0x0..0</a>
    </td>
    <td class="numeric" th:text="${pool.feeTier / 10000.0} + '%'">0.30%</td>
    <td>
        <span class="risk-badge"
              th:classappend="'risk-' + ${pool.riskBand}"
              th:text="${pool.compositeScore}">0</span>
    </td>
    <td>
        <th:block th:each="sig : ${pool.flaggedSignals}">
            <span class="signal-tag" th:text="${sig}">signal</span>
        </th:block>
        <span class="muted" th:if="${pool.flaggedSignals.isEmpty()}">&mdash;</span>
    </td>
</tr>
</body>
</html>
